<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <section class="rating-card">
            <section class="star-icon">
                <img src="images/icon-star.svg" alt="">
            </section>

            <section class="content">
                <h1>  How did we do? </h1>
                <p> Please let us know how we did with your support request. All feedback is appreciated to improve our offering! </p>
            </section>

            <section class="buttons">
                <button class="btn" type="button" aria-label="b1"> 1 </button>
                <button class="btn" type="button" aria-label="b2"> 2 </button>
                <button class="btn" type="button" aria-label="b3"> 3 </button>
                <button class="btn" type="button" aria-label="b4"> 4 </button>
                <button class="btn" type="button" aria-label="b5"> 5 </button>
                </section>
            <section>
                <button class="submit-btn" type="button" aria-label="sbmt"> Submit </button>
            </section>
        </section>


        <section class="thankyou-card">

            <section class="thanksicon">
                <img src="images/illustration-thank-you.svg" alt="">

            </section>
            <section class="ratingResult">
                <p class="rating"> You selected 4 out of 5 </p>

            </section>

            <section class="thankyou-content">
                <h2> Thank You! </h2>
                <p> We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch! </p>
            </section>

        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
